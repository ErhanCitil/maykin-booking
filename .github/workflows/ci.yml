name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its runs that are still in progress.
# Every commit on main gets its own group, so each one gets a green or red check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Pinned instead of ubuntu-latest (26.04): uwsgi 2.0.22 from requirements/ci.txt
    # is built from source and does not compile with GCC 15.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          # Throwaway database that only lives inside this job, so no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: maykinbooking
          POSTGRES_DB: maykinbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: maykinbooking.conf.ci
      SECRET_KEY: dummy
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: maykinbooking
      DB_USER: maykinbooking

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      # libpq-dev: build psycopg2; pango/harfbuzz: WeasyPrint (PDF of a booking)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpq-dev libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      # maykin-django-two-factor-auth only installs with pip < 24.1
      - name: Install Python dependencies
        run: |
          python -m pip install "pip<24.1"
          pip install -r requirements/ci.txt

      - name: Run tests
        run: python src/manage.py test src

  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      # Same versions as in requirements/dev.txt, without the project dependencies
      - name: Install black, isort and flake8
        id: install
        run: |
          grep -E '^(black|flake8|isort(\[colors\])?)==' requirements/dev.txt \
            | tee "$RUNNER_TEMP/lint-requirements.txt"
          pip install -r "$RUNNER_TEMP/lint-requirements.txt"

      # The checks below also run when an earlier one fails, to report all problems
      - name: black
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: black --check --diff src docs bin

      - name: isort
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: isort --check-only --diff src docs bin

      - name: flake8
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: flake8 src docs bin
