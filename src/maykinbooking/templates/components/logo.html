{% comment %}
  Maykin Booking logo: grachtenpand-beeldmerk + woordmerk.
  Gebruik: {% include 'components/logo.html' with variant='light' %}  (light = voor donkere achtergrond)
{% endcomment %}
<span class="inline-flex items-center gap-3">
  <svg aria-hidden="true" viewBox="0 0 64 64" class="w-10 h-10 shrink-0">
    {% if variant == 'light' %}
    <rect width="64" height="64" rx="16" fill="#F6F1E8"/>
    <path d="M16 52V30h6v-9.5c0-1.2.6-2.3 1.6-3L32 11l8.4 6.5c1 .7 1.6 1.8 1.6 3V30h6v22z" fill="#13243A"/>
    <path d="M28 52v-9a4 4 0 0 1 8 0v9z" fill="#F6F1E8"/>
    <circle cx="32" cy="24" r="3" fill="#E0A43A"/>
    {% else %}
    <rect width="64" height="64" rx="16" fill="#13243A"/>
    <path d="M16 52V30h6v-9.5c0-1.2.6-2.3 1.6-3L32 11l8.4 6.5c1 .7 1.6 1.8 1.6 3V30h6v22z" fill="#F6F1E8"/>
    <path d="M28 52v-9a4 4 0 0 1 8 0v9z" fill="#13243A"/>
    <circle cx="32" cy="24" r="3" fill="#B4492A"/>
    {% endif %}
  </svg>
  <span class="flex flex-col leading-none">
    <span class="font-display font-semibold text-2xl tracking-[-0.02em] {% if variant == 'light' %}text-linen{% else %}text-ink{% endif %}">maykin</span>
    <span class="mt-1 text-[10px] font-semibold uppercase tracking-[0.28em] {% if variant == 'light' %}text-linen/75{% else %}text-muted{% endif %}">booking</span>
  </span>
</span>
