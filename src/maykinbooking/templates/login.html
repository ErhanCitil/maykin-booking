<!DOCTYPE html>
{% load static %}
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inloggen · Maykin Booking</title>
    {% include 'components/head.html' %}
  </head>
  <body class="min-h-screen flex flex-col bg-linen text-ink font-sans antialiased">
    {% include 'components/header.html' %}

    <main class="flex-1 w-full max-w-md mx-auto px-6 py-16">
      <h1 class="font-display font-semibold text-4xl tracking-[-0.02em] mb-8">Inloggen</h1>
      <form method="POST" action="" class="card p-7 form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary w-full">Inloggen</button>
      </form>
    </main>

    {% include 'components/footer.html' %}
  </body>
</html>
